<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7" />
  <meta name="description" content="Tra cứu ICD-10 2026 TT06/QĐ1849, PL1-PL5 và thuốc/hóa chất PL3." />
  <title>Tra cứu ICD-10 2026 - KIENLT90 Portal</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="icd10.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      background: #f1f5f9 !important; /* Matches main.html bg-slate-100 */
      color: #1e293b !important;
      -webkit-tap-highlight-color: transparent;
    }
    
    .icd-page {
      max-width: 100% !important;
      padding: 0 !important;
    }

    .pro-hero {
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1) !important;
    }

    .icd-search-panel {
      background: rgba(255, 255, 255, 0.95) !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05) !important;
      backdrop-filter: blur(8px) !important;
    }

    .icd-card {
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 1rem !important;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05) !important;
      transition: all 0.2s ease !important;
    }

    .icd-card:hover {
      border-color: #cbd5e1 !important;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1) !important;
      transform: translateY(-2px);
    }

    .icd-tabs button {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 700 !important;
      border: 1px solid #e2e8f0 !important;
      background: #ffffff !important;
      color: #475569 !important;
      border-radius: 9999px !important;
      padding: 0.5rem 1rem !important;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05) !important;
      transition: all 0.15s ease !important;
    }

    .icd-tabs button:hover {
      background: #f8fafc !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }

    .icd-tabs button.active {
      background: #0284c7 !important;
      border-color: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25) !important;
    }

    .hero-stats div {
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 1rem !important;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05) !important;
    }

    .hero-stats b {
      color: #0369a1 !important;
    }

    .hero-stats span {
      color: #64748b !important;
    }

    .quick-filter-chips button, .icd-filter-chips button, .guide-topic-chips button {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      transition: all 0.15s ease !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-full flex flex-col selection:bg-sky-100 selection:text-sky-800">

  <!-- Main Responsive Container -->
  <div class="w-full max-w-7xl mx-auto min-h-screen flex flex-col px-3 sm:px-6 py-4 sm:py-6">

    <!-- Top Navigation Header matching main.html -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border border-slate-200/80 rounded-2xl shadow-sm px-4 sm:px-6 py-3.5 flex items-center justify-between mb-6">
      <div class="flex items-center space-x-3.5">
        <a href="main.html" class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-sky-800 flex items-center justify-center text-white font-extrabold shadow-md shadow-sky-500/20 text-sm tracking-tight hover:scale-105 transition" title="Về Portal">
          K90
        </a>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-xs font-bold tracking-wider text-slate-400 uppercase">KIENLT90 Portal</h1>
            <span class="inline-flex px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full text-[10px] font-bold">
              v1.0 Online
            </span>
          </div>
          <p class="text-sm sm:text-base font-extrabold text-slate-800 leading-tight">Tra cứu Danh mục Bệnh học Quốc tế ICD-10 2026</p>
        </div>
      </div>

      <!-- Desktop Navigation Menu -->
      <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200">
        <a href="main.html" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-white/60 flex items-center space-x-1.5 transition">
          <i data-lucide="home" class="w-3.5 h-3.5"></i>
          <span>Trang chủ</span>
        </a>
        <a href="survey.html" target="_blank" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-white/60 flex items-center space-x-1.5 transition">
          <i data-lucide="clipboard-list" class="w-3.5 h-3.5"></i>
          <span>Khảo sát</span>
        </a>
        <a href="math_game.html" target="_blank" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-amber-700 hover:text-amber-900 hover:bg-amber-50 flex items-center space-x-1.5 transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
          <span>Toán Tư Duy</span>
        </a>
        <a href="icd10.html" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-sky-700 bg-white shadow-xs flex items-center space-x-1.5 transition">
          <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
          <span>Tra cứu ICD-10</span>
        </a>
        <a href="xml_analyzer.html" target="_blank" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-white/60 flex items-center space-x-1.5 transition">
          <i data-lucide="file-code" class="w-3.5 h-3.5"></i>
          <span>XML 130</span>
        </a>
      </nav>

      <!-- User Actions & Back Button -->
      <div class="flex items-center space-x-2.5">
        <a href="main.html" class="h-9 sm:h-10 px-3 sm:px-4 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center justify-center space-x-1.5 text-slate-700 hover:text-sky-700 hover:bg-sky-50 hover:border-sky-200 transition text-xs font-bold shadow-xs" title="Về Portal">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Về Portal</span>
        </a>
      </div>
    </header>

    <!-- Main Content Root for React Mounting -->
    <main class="flex-1 w-full pb-12">
      <div id="root">
        <div class="loading bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-500 shadow-sm">
          <div class="fast-spinner mx-auto mb-3"></div>
          <p class="text-sm font-semibold">Đang tải danh mục dữ liệu ICD-10 2026...</p>
        </div>
      </div>
    </main>

  </div>

  <!-- Lucide icons init -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>

  <!-- React Bundle Script -->
  <script type="module" src="data/icd10_index.js"></script>
</body>
</html>
